name: Market Census Quality

on:
  pull_request:
    paths:
      - 'market/**'
      - 'python/market_census/**'
      - 'tests/**'
      - '.github/workflows/market-census-quality.yml'
  push:
    branches: [main]
    paths:
      - 'market/**'
      - 'python/market_census/**'
      - 'tests/**'

jobs:
  validate-market-census:
    runs-on: ubuntu-latest
    steps:
      - name: Runner smoke test
        run: |
          echo "GitHub-hosted runner allocated"
          uname -a
          python3 --version || true
