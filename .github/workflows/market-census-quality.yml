name: Market Census Quality

on:
  pull_request:
    paths:
      - 'market/**'
      - 'python/market_census/**'
      - 'tests/**'
      - '.github/workflows/market-census-quality.yml'
  push:
    branches: [main]
    paths:
      - 'market/**'
      - 'python/market_census/**'
      - 'tests/**'

jobs:
  validate-market-census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate raw and evidence contracts
        run: python python/market_census/build_market_census.py --validate-only
